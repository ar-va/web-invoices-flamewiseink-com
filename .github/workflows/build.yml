name: Test, build and deploy

on:
  push:
    branches: [main]
    paths: ["app/**", "tests/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to update docker-compose.yml with the new image tag
  packages: write   # to push the image to ghcr.io

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          pip install -q -r app/requirements.txt
          python -I -m unittest discover -s tests -p "test_lifecycle.py"
          python -I tests/test_app.py "$PWD/app" "$RUNNER_TEMP"

      - name: Image name and tag
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/flamewise-invoices" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
            ${{ steps.img.outputs.name }}:latest

      - name: Smoke test the built image (must start and answer /healthz)
        env:
          IMAGE: ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
        run: |
          docker run -d --name smoke -p 8000:8000 -e ADMIN_EMAIL=ci@example.com -e ADMIN_PASSWORD=ci-password-123 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo " - healthy"; docker rm -f smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Point the Portainer stack at the new image
        env:
          IMAGE: ${{ steps.img.outputs.name }}:${{ steps.img.outputs.tag }}
        run: |
          sed -i -E "s#^([[:space:]]*image:).*#\1 ${IMAGE}#" docker-compose.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Deploy ${IMAGE##*:}" && git push || echo "No change to commit"
