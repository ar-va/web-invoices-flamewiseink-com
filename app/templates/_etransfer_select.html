{# e-Transfer email dropdown with "+ Add a new email…". Needs: etransfer_current #}
{% set opts = etransfer_email_options() %}
<div class="et-picker">
  <label>e-Transfer email
    <select name="etransfer_email" class="et-select">
      {% for e in opts %}
        <option value="{{ e }}" {% if (etransfer_current or s.etransfer_email) == e %}selected{% endif %}>{{ e }}{% if e == s.etransfer_email %} (default){% endif %}</option>
      {% endfor %}
      {% if etransfer_current and etransfer_current not in opts %}
        <option value="{{ etransfer_current }}" selected>{{ etransfer_current }}</option>
      {% endif %}
      <option value="__new__">+ Add a new email…</option>
    </select>
  </label>
  <label class="et-new" hidden>New e-Transfer email
    <input type="email" name="etransfer_email_new" placeholder="name@example.com" autocomplete="off">
  </label>
  <p class="small muted et-new-hint" hidden>It's added to the list when you save, so you can pick it next time.</p>
</div>
